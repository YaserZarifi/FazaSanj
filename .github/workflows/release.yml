name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version numbers match the tag
        shell: pwsh
        run: node scripts/check-version.mjs "${{ github.ref_name }}"

      - name: Pull release notes from CHANGELOG.md
        shell: pwsh
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Fazasanj ${{ github.ref_name }}
          releaseBodyPath: release-notes.md
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis
